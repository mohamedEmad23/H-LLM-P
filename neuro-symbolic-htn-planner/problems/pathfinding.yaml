# Problem Type: Grid Pathfinding with Obstacles
# Difficulty: Hard
# Category: Search & Navigation

problem_type: "grid_pathfinding"
description: "Find shortest path in a grid with obstacles and weighted cells"

initial_state:
  grid_size: [5, 5]
  start_pos: [0, 0]
  goal_pos: [4, 4]
  obstacles:
    - [1, 1]
    - [2, 1]
    - [2, 2]
  weights:
    "[0, 1]": 2
    "[3, 3]": 5
    "[4, 3]": 3

constraints:
  algorithm: "a_star"  # or "dijkstra", "bfs"
  diagonal_moves: false
  max_path_length: 20

expected_output:
  path:
    - [0, 0]
    - [0, 1]
    - [0, 2]
    - [1, 2]
    - [1, 3]
    - [2, 3]
    - [3, 3]
    - [4, 3]
    - [4, 4]
  path_cost: 15
  nodes_explored: 18

metadata:
  difficulty: "hard"
  category: "pathfinding"
  tags: ["graph_search", "heuristic", "optimization"]
  time_complexity: "O(b^d)"
  space_complexity: "O(b^d)"

domain_hints:
  primary_task: "find_shortest_path"
  subtasks:
    - "explore_neighbors"
    - "evaluate_heuristic"
    - "reconstruct_path"
  key_operators:
    - "move_to_cell"
    - "calculate_cost"
    - "check_obstacle"
