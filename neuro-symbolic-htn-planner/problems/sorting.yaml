# Problem Type: Sorting with Constraints
# Difficulty: Medium
# Category: Sorting Algorithms

problem_type: "constrained_sorting"
description: "Sort an array with specific constraints (e.g., minimize swaps, use specific algorithm)"

initial_state:
  nums: [64, 34, 25, 12, 22, 11, 90]
  algorithm: "quicksort"  # or "mergesort", "heapsort"

constraints:
  minimize_swaps: true
  stable_sort: false
  in_place: true
  max_comparisons: 100

expected_output:
  sorted_array: [11, 12, 22, 25, 34, 64, 90]
  swap_count: 12
  comparison_count: 18

metadata:
  difficulty: "medium"
  category: "sorting"
  tags: ["divide_and_conquer", "comparison_based"]
  time_complexity: "O(n log n)"
  space_complexity: "O(log n)"

domain_hints:
  primary_task: "sort_array"
  subtasks:
    - "partition_array"
    - "recursive_sort"
    - "merge_subarrays"
  key_operators:
    - "swap_elements"
    - "compare_elements"
    - "select_pivot"
