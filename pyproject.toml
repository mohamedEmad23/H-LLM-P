[project]
name = "neuro-symbolic-htn-planner"
version = "0.1.0"
description = "A neuro-symbolic HTN planner augmented by LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LLM Providers
    "groq>=0.4.0",
    "google-genai>=0.3.0",
    "cohere>=5.0.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    
    # Core utilities
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    
    # Async support
    "aiohttp>=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuro-symbolic-htn-planner/src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"neuro-symbolic-htn-planner/tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
exclude = [
    "^neuro-symbolic-htn-planner/.*$",
]
mypy_path = "neuro-symbolic-htn-planner/src"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["neuro-symbolic-htn-planner/tests"]
